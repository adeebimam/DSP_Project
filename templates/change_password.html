{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-page">
        <div class="form-page-header">
            <h1>Change Password</h1>
            <p class="form-page-subtitle">Update your account password securely.</p>
        </div>

        <form method="POST" class="modern-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Current Password -->
            <div class="form-group-modern">
                <label>Current Password</label>
                <div style="position:relative;">
                    <input 
                        type="password" 
                        id="current_password" 
                        name="current_password" 
                        required 
                        style="padding-right:2.5rem;"
                    >
                    <span onclick="togglePassword('current_password', this)" 
                          style="position:absolute; right:0.7rem; top:50%; transform:translateY(-50%); cursor:pointer; color:#6B7280;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- New Password -->
            <div class="form-group-modern">
                <label>New Password</label>
                <div style="position:relative;">
                    <input 
                        type="password" 
                        id="new_password" 
                        name="new_password" 
                        required 
                        style="padding-right:2.5rem;"
                    >
                    <span onclick="togglePassword('new_password', this)" 
                          style="position:absolute; right:0.7rem; top:50%; transform:translateY(-50%); cursor:pointer; color:#6B7280;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group-modern">
                <label>Confirm New Password</label>
                <div style="position:relative;">
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        required 
                        style="padding-right:2.5rem;"
                    >
                    <span onclick="togglePassword('confirm_password', this)" 
                          style="position:absolute; right:0.7rem; top:50%; transform:translateY(-50%); cursor:pointer; color:#6B7280;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-form">Update Password</button>
                <a href="{{ url_for('account_settings') }}" class="btn btn-cancel btn-form">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(id, el) {
    var input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        el.style.opacity = 0.6;
    } else {
        input.type = "password";
        el.style.opacity = 1;
    }
}
</script>
{% endblock %}
