{% extends "base.html" %}

{% block title %}Forgot Password - Expense Tracker{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-page" style="max-width: 500px;">

        <div class="form-page-header">
            <h1>Forgot Password</h1>
            <p class="form-page-subtitle">
                Enter your email address to continue with password recovery.
            </p>
        </div>

        <form method="POST" action="/forgot-password" class="modern-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group-modern">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-form">
                    Continue
                </button>
                <a href="/" class="btn btn-cancel btn-form">
                    Back to Login
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
